<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-label="Terminal: Abhishek Kumar, AI engineer. Eval run shows agent stability rising from 74% to 98%.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .prompt { fill: #7ee787; }
    .cmd    { fill: #e6edf3; }
    .out    { fill: #8b949e; }
    .ok     { fill: #7ee787; font-weight: 700; }
    .hi     { fill: #79c0ff; }
    .warn   { fill: #d29922; }
    .pink   { fill: #ff7b72; }
    .line   { opacity: 0; animation: show .01s forwards; }
    @keyframes show { to { opacity: 1; } }
    .l1  { animation-delay: .3s; }  .l2  { animation-delay: .9s; }
    .l3  { animation-delay: 1.5s; } .l4  { animation-delay: 2.1s; }
    .l5  { animation-delay: 2.8s; } .l6  { animation-delay: 3.4s; }
    .l7  { animation-delay: 4.0s; } .l8  { animation-delay: 5.6s; }
    .l9  { animation-delay: 6.2s; } .l10 { animation-delay: 6.8s; }
    .l11 { animation-delay: 7.4s; } .l12 { animation-delay: 8.0s; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.6s 4.0s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { 0% { transform: scaleX(0); } 45% { transform: scaleX(.755); } 100% { transform: scaleX(1); } }
    .pct { opacity: 0; animation: show .01s 5.6s forwards; }
    .pct0 { opacity: 0; animation: show .01s 4.0s forwards, hide .01s 5.6s forwards; }
    @keyframes hide { to { opacity: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; animation-delay: 8.2s; opacity: 0; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="879" height="429" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="879" height="38" rx="12" fill="#161b22"/>
  <rect x="0.5" y="26" width="879" height="13" fill="#161b22"/>
  <line x1="0" y1="38.5" x2="880" y2="38.5" stroke="#30363d"/>
  <circle cx="24" cy="19.5" r="6.5" fill="#ff5f57"/>
  <circle cx="46" cy="19.5" r="6.5" fill="#febc2e"/>
  <circle cx="68" cy="19.5" r="6.5" fill="#28c840"/>
  <text x="440" y="24.5" text-anchor="middle" class="mono out" style="font-size:13px">abhi@prod: ~/logs</text>

  <g class="mono">
    <text x="28" y="72"  class="line l1"><tspan class="prompt">❯</tspan><tspan class="cmd"> whoami</tspan></text>
    <text x="28" y="96"  class="line l2"><tspan class="hi">Abhishek Kumar</tspan><tspan class="out"> · AI Engineer @ BrowserStack · 2× Champion Award</tspan></text>

    <text x="28" y="130" class="line l3"><tspan class="prompt">❯</tspan><tspan class="cmd"> cat focus.txt</tspan></text>
    <text x="28" y="154" class="line l4" fill="#e6edf3">LLM evals · agent reliability · model selection · production AI infra</text>

    <text x="28" y="188" class="line l5"><tspan class="prompt">❯</tspan><tspan class="cmd"> ./run_evals --agent prod --compare baseline</tspan></text>
    <text x="28" y="212" class="line l6"><tspan class="warn">[eval]</tspan><tspan class="out"> loading production traces, clustering failures...</tspan></text>

    <!-- stability bar -->
    <g class="line l7">
      <text x="28" y="240"><tspan class="warn">[eval]</tspan><tspan class="out"> stability</tspan></text>
      <rect x="160" y="227" width="320" height="16" rx="3" fill="#21262d"/>
      <rect class="bar" x="160" y="227" width="313.6" height="16" rx="3" fill="#7ee787"/>
      <text x="494" y="240" class="pct0 warn">74%</text>
      <text x="494" y="240" class="pct ok">98% ✓</text>
    </g>

    <text x="28" y="268" class="line l8"><tspan class="warn">[ops ]</tspan><tspan class="out"> ticket SLA adherence ......... </tspan><tspan class="pink">40%</tspan><tspan class="out"> → </tspan><tspan class="ok">88% ✓</tspan></text>
    <text x="28" y="292" class="line l9"><tspan class="warn">[prod]</tspan><tspan class="out"> user engagement .............. </tspan><tspan class="ok">+55% ✓</tspan></text>

    <text x="28" y="326" class="line l10"><tspan class="prompt">❯</tspan><tspan class="cmd"> echo $NEXT</tspan></text>
    <text x="28" y="350" class="line l11" fill="#e6edf3">Building AI agents that don't break, and logging all of it in public.</text>
    <text x="28" y="374" class="line l12"><tspan class="out">→ </tspan><tspan class="hi">x.com/logsofabhi</tspan><tspan class="out">  ·  open to AI engineering roles in Europe</tspan></text>

    <text x="28" y="408" class="line l12"><tspan class="prompt">❯</tspan></text>
    <rect class="cursor" x="44" y="395" width="9" height="17" fill="#e6edf3"/>
  </g>
</svg>
